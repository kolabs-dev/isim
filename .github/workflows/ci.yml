# Builds isim on a stock Ubuntu 24.04 image, then tests it under every iOS version it emulates, then reports:
#
#   build  ->  test (iOS 17) | test (iOS 18) | test (iOS 26) | test (iOS 27)  ->  status
#
# - build: builds isim and runs the ABI check, then saves the build (isim/out) to the cache under this run's key.
# - test (iOS N), in parallel, each from that exact build: iOS 18 (iPhone 16 Pro, the default) runs every test; iOS 17
#   (iPhone 15), 26 and 27 (iPhone 17) run the os_matrix tests, the ones whose behaviour depends on the version
#   (docs/TESTING.md, "Which tests run under every iOS version").
# - status: posts the commit status "ci / build and test" once the four test jobs are done (success only if the build
#   and all four passed): the check main's ruleset requires (runs started from the Actions tab are not counted as a
#   pull request's checks; commit statuses are).
# Pull requests: manual only (Actions -> CI -> Run workflow). A PR from a branch of this repository: run it on that
# branch. A PR from a fork (whose branch is not in this repository): run it on main with the PR's number (`pr`); the
# run checks out the PR's head commit as it was when the run started, builds and tests it with main's workflow, and
# posts the status on that commit, so it shows on the PR. Pushes to main run automatically, so
# main always has a fresh build cache: a branch's first run starts from it. The build is cached: build.py ci gives
# unchanged sources their cached timestamps back, so Ninja rebuilds only what the pull request touched since the
# branch's (or main's) last cached build.
# A PR's code is not trusted: it runs only inside the CI container, which gets no token (the checkouts keep no
# credentials, and GH_TOKEN is set only on the steps that post statuses or look the PR up); a run with `pr` saves no
# shared cache other than its own build (third-party sources, the Swift toolchain and the image's layers are saved
# only by runs of this repository's own code), and its build cache is keyed by the PR, so no other branch restores it.
name: CI
run-name: "${{ inputs.pr && format('CI (PR #{0})', inputs.pr) || '' }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number, for a PR from a fork (run on main); empty to test the selected branch"
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
# a newer run cancels an older one on the same PR branch (or for the same `pr`); on main every commit gets its own
# group, so no run there is cancelled (a cancelled run would show as failing on the README badge) and each merge gets
# its own result
concurrency:
  group: ci-${{ inputs.pr && format('pr-{0}', inputs.pr) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ inputs.pr != '' || github.ref != 'refs/heads/main' }}
env:
  PR: ${{ inputs.pr }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # a run with `pr` keys its build by the PR (pr-N), never by the branch it was started on (main)
  BUILD_PREFIX: build-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref_name }}
  BUILD_KEY: build-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}
  SWIFT_KEY: swift-6.2.4-ubuntu24.04          # isim/ci/swift-toolchain.sh's toolchain (release.yml uses the same key)
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90          # a cold build (no cache yet) takes much longer than the usual cached run
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # the commit under test: the selected branch's, or with `pr` the PR's head now (every job checks out this
      # commit, so a push to the PR during the run does not mix two commits)
      - name: Commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PR" ]; then echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a pull request number, not '$PR'"; exit 1; }
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          read -r state sha head <<< "$info"
          [ "$state" = open ] || { echo "::error::pull request #$PR is $state"; exit 1; }
          echo "Testing pull request #$PR: $head at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # the commit status is for pull requests (a manual run's job does not count as a PR's check); on main the jobs'
      # own checks are enough
      - name: Status (pending)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: repos/${{ github.repository }}/statuses/${{ steps.commit.outputs.sha }}
        run: gh api "$STATUS" -f state=pending -f context="ci / build and test" -f description="running" -f target_url="$RUN_URL" >/dev/null
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: CI image (Ubuntu 24.04)
        uses: docker/build-push-action@v7
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha
          cache-to: ${{ !inputs.pr && 'type=gha,mode=max' || '' }}
      # restore and save as separate steps: the combined action saves only when the whole job succeeds
      - name: Pinned third-party sources (restore)
        id: third-party
        uses: actions/cache/restore@v5
        with:
          path: third_party
          key: third-party-${{ hashFiles('isim/buildlib/fetch.py') }}
      - name: Build cache (restore)
        uses: actions/cache/restore@v5
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: ${{ env.BUILD_KEY }}
          restore-keys: |
            ${{ env.BUILD_PREFIX }}-
            build-main-
      # Swift 6.2.4 from swift.org, checked against its signing keys (isim/ci/swift-toolchain.sh): the build and the
      # tests compile with it (ISIM_SWIFT_TOOLCHAIN); cached once per toolchain
      - name: Swift toolchain (restore)
        id: swift-toolchain
        uses: actions/cache/restore@v5
        with:
          path: ~/swift-toolchain
          key: ${{ env.SWIFT_KEY }}
      - name: Swift toolchain (download)
        if: steps.swift-toolchain.outputs.cache-hit != 'true'
        run: isim/ci/swift-toolchain.sh ~/swift-toolchain
      - name: Swift toolchain (save)
        if: ${{ steps.swift-toolchain.outputs.cache-hit != 'true' && !inputs.pr }}
        uses: actions/cache/save@v5
        with:
          path: ~/swift-toolchain
          key: ${{ env.SWIFT_KEY }}
      - name: Build
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -v "$HOME/swift-toolchain:$HOME/swift-toolchain:ro" -e ISIM_SWIFT_TOOLCHAIN="$HOME/swift-toolchain" \
            -e CI=1 isim-ci python3 isim/build.py ci build
      # the container runs as root; give the runner its files back (tar for the cache)
      - name: File ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" isim/out third_party
      - name: Pinned third-party sources (save)
        if: ${{ !cancelled() && steps.third-party.outputs.cache-hit != 'true' && !inputs.pr }}
        uses: actions/cache/save@v5
        with:
          path: third_party
          key: third-party-${{ hashFiles('isim/buildlib/fetch.py') }}
      # saved even when the build fails (Ninja resumes a partial build), but not when the run was cancelled; the run id
      # in the key lets every run save (cache keys cannot be overwritten). The test jobs restore exactly this key; the
      # next run on the branch, and a new branch's first run (from main's), restores the newest.
      # built into the source tree (the sample's Xcode project references it there), so not in isim/out: the test jobs
      # get it as an artifact
      - name: Build outputs outside isim/out
        uses: actions/upload-artifact@v6
        with:
          name: build-extras
          path: isim/samples/HelloToolchain/Vendor/Sum.xcframework
          if-no-files-found: error
          retention-days: 1
      - name: Build cache (save)
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: ${{ env.BUILD_KEY }}

  test:
    name: test (iOS ${{ matrix.ios }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false             # every version reports, even when another fails
      matrix:
        include:
          - { ios: "17", args: "-m os_matrix --os 17 --device iphone15" }
          - { ios: "18", args: "" }                                         # the default version: every test
          - { ios: "26", args: "-m os_matrix --os 26 --device iphone17" }
          - { ios: "27", args: "-m os_matrix --os 27 --device iphone17" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: CI image (Ubuntu 24.04)
        uses: docker/build-push-action@v7
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha
      - name: Build (from the build job)
        uses: actions/cache/restore@v5
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: ${{ env.BUILD_KEY }}
          fail-on-cache-miss: true
      - name: Build outputs outside isim/out
        uses: actions/download-artifact@v7
        with:
          name: build-extras
          path: isim/samples/HelloToolchain/Vendor/Sum.xcframework
      - name: Swift toolchain (from the build job)
        uses: actions/cache/restore@v5
        with:
          path: ~/swift-toolchain
          key: ${{ env.SWIFT_KEY }}
          fail-on-cache-miss: true
      - name: Test
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -v "$HOME/swift-toolchain:$HOME/swift-toolchain:ro" -e ISIM_SWIFT_TOOLCHAIN="$HOME/swift-toolchain" \
            -e CI=1 -e ISIM_TEST_JOBS="$(nproc)" -e ISIM_WAIT_SCALE=3 isim-ci python3 isim/build.py ci test -- ${{ matrix.args }}
      - name: File ownership (tests)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" isim/out
      - name: Test summary
        if: always()
        run: |
          echo "### iOS ${{ matrix.ios }}" >> "$GITHUB_STEP_SUMMARY"
          cat isim/out/test-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-ios${{ matrix.ios }}
          path: |
            isim/out/test-results.xml
            isim/out/test.log
            isim/out/pytest/**/*.png
            isim/out/pytest/**/*.txt
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: status
    if: always()
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      # one summary for the four test jobs: totals and failures per iOS version, the os_matrix tests side by side
      # (report.py from the branch the run was started on, never a PR's: this job's steps have the token)
      - uses: actions/checkout@v5
        with:
          sparse-checkout: isim/buildlib
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: test-results-ios*
          path: results
      - name: Test results by iOS version
        run: |
          args=""
          for v in 17 18 26 27; do args="$args $v=results/test-results-ios$v/test-results.xml"; done
          python3 isim/buildlib/report.py matrix matrix.md $args
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Status (result)
        if: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: repos/${{ github.repository }}/statuses/${{ needs.build.outputs.sha }}
        run: |
          b="${{ needs.build.result }}" t="${{ needs.test.result }}"
          if [ "$b" = success ] && [ "$t" = success ]; then state=success
          elif [ "$b" = cancelled ] || [ "$t" = cancelled ]; then state=error
          else state=failure; fi
          gh api "$STATUS" -f state="$state" -f context="ci / build and test" -f description="build $b, tests (iOS 17, 18, 26, 27) $t" \
            -f target_url="$RUN_URL" >/dev/null
