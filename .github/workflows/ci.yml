# Builds isim and runs every test (pytest) plus the ABI check on a stock Ubuntu 24.04 image.
# Manual only: Actions -> CI -> Run workflow, on a pull request's branch (the result attaches to that commit).
# The build is cached: build.py ci gives unchanged sources their cached timestamps back, so Ninja rebuilds only what
# the pull request touched since the branch's (or main's) last cached build.
name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90          # a cold build (no cache yet) takes much longer than the usual cached run
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: CI image (Ubuntu 24.04)
        uses: docker/build-push-action@v6
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pinned third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('isim/buildlib/fetch.py') }}
      - name: Build cache
        uses: actions/cache@v4
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-
            build-main-
      - name: Swift compiler image
        run: docker pull -q swift:6.2
      - name: Build and test
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v /var/run/docker.sock:/var/run/docker.sock \
            -e CI=1 isim-ci python3 isim/build.py ci
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            isim/out/test-results.xml
            isim/out/test.log
            isim/out/pytest/**/*.png
            isim/out/pytest/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
