# Releasing isim, in two steps; main only accepts pull requests:
# 1. Actions -> Release -> Run workflow on main, choosing patch, minor or major (job "prepare"). It runs only when CI
#    (build, then the tests under iOS 17, 18, 26 and 27) passed on main's head. It sets the next version after the latest release tag, builds and
#    packages it (the host runtime in the release container, Ubuntu 22.04), smoke-tests the tarball on Ubuntu 24.04,
#    records the ABI baseline, keeps the tarball as an artifact, pushes a release-X.Y.Z branch (isim/VERSION, the
#    README's examples, isim/abi/vX.Y.Z.txt.gz), opens its "Release X.Y.Z" pull request (or links to it when the
#    organization does not let Actions open pull requests) and starts CI on it. dry_run stops after the smoke test.
# 2. Merging that pull request publishes (job "publish", when the pull request is merged; only a pull request opened by
#    github-actions[bot] from release-X.Y.Z counts, not any pull request titled "Release ..."): the tag vX.Y.Z on the
#    merge commit and a GitHub release with the tarball built in step 1, its checksum and notes generated by GitHub.
#    If main moved in between (the merged tree is not the one that was packaged), nothing is published: run step 1 again.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to release
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Dry run (build, package and smoke-test only; no branch, pull request or release)
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [main]
    paths: [isim/VERSION]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write          # the release branch
      pull-requests: write     # its pull request
      actions: write           # CI on the release branch, and reading CI's result on main
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preconditions (main, CI passed on its head)
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::run the release on main"; exit 1; fi
          # the newest CI run for main's head (build, then the tests under iOS 17, 18, 26 and 27) must have passed
          ci=$(gh run list --workflow CI --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion \
                 --jq '.[0] | if . == null then "none" elif .status != "completed" then .status else .conclusion end')
          if [ "$ci" != success ]; then
            echo "::error::CI has not passed on main's head ${GITHUB_SHA::7} ($ci); wait for it, or run CI on main"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                        # the release tags (the next version follows the latest one)
      - name: Version
        id: version
        run: |
          v=$(python3 isim/build.py version "${{ inputs.bump }}")
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::v$v already exists"; exit 1; fi
          if git ls-remote --exit-code --heads origin "release-$v" >/dev/null; then
            echo "::error::the branch release-$v already exists (an open release pull request?)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasing $v (after $(git tag -l 'v*' | sort -V | tail -1))"
      - uses: docker/setup-buildx-action@v3
      - name: CI image (Ubuntu 24.04)
        uses: docker/build-push-action@v6
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release image (Ubuntu 22.04, glibc 2.35)
        uses: docker/build-push-action@v6
        with:
          context: isim/release
          load: true
          tags: isim-release-build
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Pinned third-party sources
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('isim/buildlib/fetch.py') }}
      - name: Build cache (main's)
        uses: actions/cache/restore@v4
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: build-main-${{ github.sha }}
          restore-keys: build-main-
      - name: Swift compiler image
        run: docker pull -q swift:6.2
      - name: Build and package
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v /var/run/docker.sock:/var/run/docker.sock -e CI=1 \
            -e ISIM_RELEASE_IMAGE=isim-release-build isim-ci \
            bash -c 'python3 isim/build.py ci build && python3 isim/build.py package "${{ steps.version.outputs.version }}"'
          sudo chown -R "$(id -u):$(id -g)" isim/out isim/dist third_party
      - name: Smoke test (the tarball on Ubuntu 24.04)
        run: |
          v=${{ steps.version.outputs.version }}
          docker run --rm -v "$PWD:$PWD" -w "$PWD" isim-ci bash -c "
            set -e; t=\$(mktemp -d); tar -C \$t -xzf isim/dist/isim-$v-linux-x86_64.tar.gz; r=\$t/isim-$v-linux-x86_64
            ISIM_DATA=\$t/data \$r/bin/isim version | grep -q 'isim $v'
            ISIM_DATA=\$t/data ISIM_HEADLESS=1 ISIM_SCRIPT='wait 2; shot '\$t'/shot.png; quit' \$r/bin/isim run \$r/apps/HelloSwiftUI.app
            test -s \$t/shot.png && echo 'smoke test: isim $v runs HelloSwiftUI'"
      - name: ABI baseline and release commit
        run: |
          v=${{ steps.version.outputs.version }}
          # in the CI image: the runner has no llvm-nm / llvm-objdump; as the runner's user, so git can add the file
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -u "$(id -u):$(id -g)" isim-ci \
            python3 isim/tools/abi-check.py --record "$v" "isim/dist/isim-$v-linux-x86_64/sdk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release-$v"
          git add isim/VERSION README.md "isim/abi/v$v.txt.gz"
          git commit -q -m "Release $v" -m "Version $v and its ABI baseline (Release workflow, run $GITHUB_RUN_ID)."
          git rev-parse 'HEAD^{tree}' > "isim/dist/isim-$v.tree"     # publish checks the merged tree is this one
      - name: Tarball
        uses: actions/upload-artifact@v4
        with:
          name: isim-release-${{ steps.version.outputs.version }}${{ inputs.dry_run && '-dry-run' || '' }}
          path: |
            isim/dist/isim-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            isim/dist/isim-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            isim/dist/isim-${{ steps.version.outputs.version }}.tree
          retention-days: 30
      - name: Release pull request
        if: ${{ !inputs.dry_run }}
        run: |
          v=${{ steps.version.outputs.version }}
          git push -q origin "release-$v"
          body="Release $v, prepared by the Release workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): isim/VERSION, the README's version examples and the ABI baseline isim/abi/v$v.txt.gz. The tarball is built and smoke-tested. Merging publishes v$v (tag + GitHub release, notes generated by GitHub)."
          # needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
          url=$(gh pr create --base main --head "release-$v" --title "Release $v" --body "$body")
          echo "release pull request: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run CI --ref "release-$v"
          echo "CI started on release-$v" >> "$GITHUB_STEP_SUMMARY"

  publish:
    # only the pull request the prepare job opened, once merged: opened by github-actions[bot] from release-X.Y.Z in this repo
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # the tag and the release
      actions: read            # the prepare run's tarball
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}     # the squashed commit on main
          fetch-depth: 0
      - name: Version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          v=$(cat isim/VERSION)
          if [ "$HEAD_REF" != "release-$v" ]; then echo "::error::the branch $HEAD_REF is not release-$v"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag -l 'v*' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - name: The tarball from the prepare run
        run: |
          v=${{ steps.version.outputs.version }}
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=isim-release-$v&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$id" ]; then echo "::error::no isim-release-$v artifact (run Release for $v first)"; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > release.zip
          mkdir -p dist && unzip -q release.zip -d dist
          (cd dist && sha256sum -c "isim-$v-linux-x86_64.tar.gz.sha256")
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(cat "dist/isim-$v.tree")" ]; then
            echo "::error::main changed between packaging and the merge (the merged tree is not the packaged one); nothing was published. Run Release again."
            exit 1
          fi
      - name: GitHub release
        env:
          PREV: ${{ steps.version.outputs.previous }}
        run: |
          v=${{ steps.version.outputs.version }}
          d=dist/isim-$v-linux-x86_64.tar.gz
          # notes generated by GitHub from the pull requests merged since the previous release
          gh release create "v$v" "$d" "$d.sha256" --target "$(git rev-parse HEAD)" --title "isim $v" \
            --generate-notes ${PREV:+--notes-start-tag "$PREV"}
          echo "published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$v" | tee -a "$GITHUB_STEP_SUMMARY"
