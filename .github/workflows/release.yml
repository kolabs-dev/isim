# Releases isim: Actions -> Release -> Run workflow on main, choosing patch, minor or major.
# Runs only on main and only when CI ("ci / build and test") is green on main's head commit. It sets the next version
# after the latest release tag, builds and packages it (the host runtime in the release container, Ubuntu 22.04),
# smoke-tests the tarball on Ubuntu 24.04, records the release's ABI baseline, pushes one "Release X.Y.Z" commit to main
# (isim/VERSION, the README's examples, isim/abi/vX.Y.Z.txt.gz; GitHub Actions may bypass main's ruleset for this),
# tags it and publishes the GitHub release with the tarball, its checksum and notes generated by GitHub. dry_run does everything except the commit
# and the release, and uploads the tarball as an artifact instead.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to release
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Dry run (build, package and smoke-test only; no commit, tag or release)
        type: boolean
        default: false
permissions:
  contents: write
  statuses: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preconditions (main, CI green on its head)
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::run the release on main"; exit 1; fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
                    --jq '[.[] | select(.context == "ci / build and test")][0].state // "none"')
          if [ "$state" != success ]; then
            echo "::error::CI is not green on main's head ${GITHUB_SHA::7} (ci / build and test: $state); wait for it, or run CI on main"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                        # the release tags (the next version follows the latest one)
      - name: Version
        id: version
        run: |
          prev=$(git tag -l 'v*' | sort -V | tail -1)
          v=$(python3 isim/build.py version "${{ inputs.bump }}")
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "releasing $v (after ${prev:-no release})"
      - uses: docker/setup-buildx-action@v3
      - name: CI image (Ubuntu 24.04)
        uses: docker/build-push-action@v6
        with:
          context: isim/ci
          load: true
          tags: isim-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release image (Ubuntu 22.04, glibc 2.35)
        uses: docker/build-push-action@v6
        with:
          context: isim/release
          load: true
          tags: isim-release-build
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Pinned third-party sources
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('isim/buildlib/fetch.py') }}
      - name: Build cache (main's)
        uses: actions/cache/restore@v4
        with:
          path: |
            isim/out
            !isim/out/pytest
            !isim/out/test-*
          key: build-main-${{ github.sha }}
          restore-keys: build-main-
      - name: Swift compiler image
        run: docker pull -q swift:6.2
      - name: Build and package
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v /var/run/docker.sock:/var/run/docker.sock -e CI=1 \
            -e ISIM_RELEASE_IMAGE=isim-release-build isim-ci \
            bash -c 'python3 isim/build.py ci build && python3 isim/build.py package "${{ steps.version.outputs.version }}"'
          sudo chown -R "$(id -u):$(id -g)" isim/out isim/dist third_party
      - name: Smoke test (the tarball on Ubuntu 24.04)
        run: |
          v=${{ steps.version.outputs.version }}
          docker run --rm -v "$PWD:$PWD" -w "$PWD" isim-ci bash -c "
            set -e; t=\$(mktemp -d); tar -C \$t -xzf isim/dist/isim-$v-linux-x86_64.tar.gz; r=\$t/isim-$v-linux-x86_64
            ISIM_DATA=\$t/data \$r/bin/isim version | grep -q 'isim $v'
            ISIM_DATA=\$t/data ISIM_HEADLESS=1 ISIM_SCRIPT='wait 2; shot '\$t'/shot.png; quit' \$r/bin/isim run \$r/apps/HelloSwiftUI.app
            test -s \$t/shot.png && echo 'smoke test: isim $v runs HelloSwiftUI'"
      - name: ABI baseline
        run: python3 isim/tools/abi-check.py --record "${{ steps.version.outputs.version }}" "isim/dist/isim-${{ steps.version.outputs.version }}-linux-x86_64/sdk"
      - name: Tarball (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: isim-${{ steps.version.outputs.version }}-dry-run
          path: |
            isim/dist/isim-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            isim/dist/isim-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            isim/abi/v${{ steps.version.outputs.version }}.txt.gz
          retention-days: 7
      - name: Release commit on main
        if: ${{ !inputs.dry_run }}
        run: |
          v=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isim/VERSION README.md "isim/abi/v$v.txt.gz"
          git commit -m "Release $v" -m "Version $v and its ABI baseline (Release workflow, run $GITHUB_RUN_ID)."
          git push origin HEAD:main                 # fails if main moved since the run started: nothing is released then
      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          v=${{ steps.version.outputs.version }}
          d=isim/dist/isim-$v-linux-x86_64.tar.gz
          # notes generated by GitHub from the pull requests merged since the previous release
          gh release create "v$v" "$d" "$d.sha256" --target "$(git rev-parse HEAD)" --title "isim $v" \
            --generate-notes ${PREV:+--notes-start-tag "$PREV"}
        env:
          PREV: ${{ steps.version.outputs.previous }}
